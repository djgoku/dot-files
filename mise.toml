# Project config for THIS REPO -- tasks and the tools they need, nothing else.
# Machine config lives in config/mise/ and is not loaded from here; see the
# comment at the top of config/mise/config.toml for why the split exists.

[tools]
# Only needed to regenerate the workflow YAML, so it is a project tool rather
# than something every machine installs.
pkl = "latest"

[tasks.render-workflows]
description = "Regenerate .github/workflows/*.yml from their .pkl sources"
run = """
set -eu
for src in .github/workflows/*.pkl; do
  out=".github/workflows/$(basename "$src" .pkl).yml"
  pkl eval --project-dir .github/ -f yaml -o "$out" "$src"
  echo "rendered $out"
done
"""

[tasks.check-workflows]
description = "Fail if the generated workflow YAML has drifted from its .pkl source"
depends = ["render-workflows"]
# Scoped to the generated YAML: the .pkl sources are inputs, not outputs.
run = "git diff --exit-code -- '.github/workflows/*.yml'"

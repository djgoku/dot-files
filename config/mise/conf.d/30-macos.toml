# NOTE: `apply` here writes to your REAL macOS preferences -- the sandbox HOME
# does not isolate them (cfprefsd is keyed by uid). Use status/--dry-run only.
[bootstrap.macos.finder]
show_all_files = true
preferred_view_style = "list"
show_pathbar = true

[bootstrap.macos.defaults]
NSGlobalDomain = { "com.apple.swipescrolldirection" = false, AppleInterfaceStyle = "Dark" }

[bootstrap.macos.dock]
autohide = true
orientation = "left"
tilesize = 48
show_recents = false

[bootstrap.macos.trackpad]
tap_to_click = true

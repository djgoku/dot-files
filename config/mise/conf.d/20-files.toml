# Mise creates missing parent directories with OS default permissions. Declare
# directories whose mode matters. The files phase precedes dotfiles, so the
# mode is correct before gpg-agent.conf lands inside. GnuPG requires 0700.
[bootstrap.directories."~/.gnupg"]
mode = "0700"

# ControlMaster sockets for ssh/config.tmpl. ssh will not create this itself,
# and without it there is no multiplexing -- a YubiKey touch per connection.
[bootstrap.directories."~/.ssh"]
mode = "0700"

[bootstrap.directories."~/.ssh/cm"]
mode = "0700"

[bootstrap.directories."~/.local/share/zsh"]
mode = "0755"

[bootstrap.directories."~/.local/share/zsh/site-functions"]
mode = "0755"

# zsh/.zshrc prepends this directory to $fpath ahead of compinit.
[bootstrap.files."~/.local/share/zsh/site-functions/_mise"]
mode = "0644"
template = true
content = "{{ exec(command='mise completion zsh') }}"

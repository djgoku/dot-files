# Generated from Workflow.pkl. DO NOT EDIT.
name: Validate
'on':
  pull_request: {}
  push:
    branches:
    - main
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - name: Install mise
      run: curl -fsSL https://mise.run | sh
    - name: Workflow YAML matches its Pkl source
      run: |-
        ~/.local/bin/mise trust --yes
        ~/.local/bin/mise install
        ~/.local/bin/mise run check-workflows
    - name: Prepare, via the real setup.sh
      run: |-
        mkdir -p ~/dev/github/djgoku
        ln -sfn "$GITHUB_WORKSPACE" ~/dev/github/djgoku/dot-files
        ./setup.sh --no-clone --prepare-only
    - name: Machine config loads
      run: |-
        ~/.local/bin/mise config ls
        test "$(~/.local/bin/mise config ls --no-header | grep -c 'config/mise')" = "5"
    - name: Every bootstrap stage resolves
      run: ~/.local/bin/mise bootstrap --dry-run
    - name: Custom aqua registry is configured and reachable
      run: |-
        ~/.local/bin/mise settings get aqua.registries
        ~/.local/bin/mise ls-remote aqua:djgoku/misemacs-emacs-master | grep -q .
